services:
  - type: web
    name: artist-intelligence-recommendation-system
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://ameydongre10.github.io,http://localhost:3000,http://localhost:5173,https://*.vercel.app"

